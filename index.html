<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMORROW — Downloads</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin: 10px 0 35px;
            text-align: center;
            color: #999;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 13px 18px;
            border: 1px solid #292929;
            background: #0b0b0b;
            color: #888;
            font: inherit;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .tab:hover {
            color: #fff;
            border-color: #555;
        }

        .tab.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        #downloads {
            display: grid;
            gap: 12px;
        }

        .file {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 12px;
            border: 1px solid #292929;
            background: #0b0b0b;
        }

        .file-preview {
            flex: 0 0 120px;
            width: 120px;
            height: 72px;
            object-fit: cover;
            display: block;
            border: 1px solid #292929;
        }

        .file-info {
            min-width: 0;
            flex: 1;
        }

        .file-name {
            min-width: 0;
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .download {
            flex: 0 0 auto;
            display: inline-block;
            padding: 9px 15px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.15s, color 0.15s;
        }

        .download:hover {
            background: #fff;
            color: #000;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .tabs {
                flex-direction: column;
            }

            .file {
                align-items: stretch;
                flex-direction: column;
            }

            .file-preview {
                width: 100%;
                height: 160px;
                flex-basis: auto;
            }

            .file-info {
                width: 100%;
            }

            .download {
                width: 100%;
                text-align: center;
            }
        }
    </style>

    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/ThePhirst/gallery/main/images/debug_nodraw.jpg">

    <style>
        html, body, * {
            cursor: none !important;
        }

        #customCursor {
            position: fixed;
            display: block;
            width: 48px;
            height: 48px;
            object-fit: contain;
            pointer-events: none;
            z-index: 10001;
            transform: translate(-6px, -6px);
        }
    </style>
</head>

<body>
    <main>
        <h1>MAYBENEXTTIME</h1>
        <p class="subtitle">BUTFORNOWLETSTALK</p>

        <div class="tabs">
            <button class="tab active" data-category="tomorrow">TOMORROW</button>
        </div>

        <div id="downloads"></div>
    </main>

    <img id="customCursor" src="https://raw.githubusercontent.com/ThePhirst/gallery/main/images/node.gif" alt="">

    <script>
        const customCursor = document.getElementById("customCursor");
        const normalCursor = "https://raw.githubusercontent.com/ThePhirst/gallery/main/images/node.gif";
        const hoveringCursor = "https://raw.githubusercontent.com/ThePhirst/gallery/main/images/node_hovering.gif";

        let cursorHovering = false;

        function setCursorState(hovering) {
            if (hovering === cursorHovering) {
                return;
            }

            cursorHovering = hovering;
            customCursor.src = hovering ? hoveringCursor : normalCursor;
        }

        document.addEventListener("mousemove", function(event) {
            customCursor.style.left = event.clientX + "px";
            customCursor.style.top = event.clientY + "px";

            const clickable = event.target.closest("a, button, [onclick]");
            setCursorState(!!clickable);
        });

        function getGoogleDriveDownloadUrl(id) {
            return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(id);
        }

        function createFileElement(file) {
            const item = document.createElement("div");
            item.className = "file";

            if (file.previewUrl) {
                const preview = document.createElement("img");
                preview.className = "file-preview";
                preview.src = file.previewUrl;
                preview.alt = "";
                preview.loading = "lazy";
                item.appendChild(preview);
            }

            const info = document.createElement("div");
            info.className = "file-info";

            const name = document.createElement("div");
            name.className = "file-name";
            name.textContent = file.name;

            info.appendChild(name);

            const button = document.createElement("a");
            button.className = "download";
            button.href = file.downloadUrl;
            button.download = file.name;
            button.textContent = "Download";

            item.appendChild(info);
            item.appendChild(button);

            return item;
        }

        const tomorrowFiles = [
            {
                name: "TOMORROW",
                downloadUrl: getGoogleDriveDownloadUrl("14QFyxxJpugKx0K2Bc2oGYMSqzclpxcMT"),
                previewUrl: "images/tomorrow.jpg"
            },
            {
                name: "RESPONSES",
                downloadUrl: getGoogleDriveDownloadUrl("1WyPRCcvgKKBYVo9j9tLPLufdC23ajWjq")
            },
            {
                name: "✺✺✺✺✺",
                downloadUrl: getGoogleDriveDownloadUrl("1QMX7tzJuekQlqiZKm053IPw_SrrCMxX5")
            }
        ];

        tomorrowFiles.forEach(file => {
            downloads.appendChild(createFileElement(file));
        });
    </script>
</body>
</html>
